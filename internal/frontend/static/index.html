<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>mcp-weather</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg: #0f1117; --surface: #1a1d27; --border: #2a2d3a; --text: #e2e4ed;
  --muted: #6b7280; --accent: #6366f1; --accent-dim: #312e81;
  --ok: #22c55e; --err: #ef4444; --warn: #f59e0b;
  font-family: ui-monospace, 'Cascadia Code', 'Fira Code', monospace;
}
body { background: var(--bg); color: var(--text); min-height: 100vh; }

header {
  display: flex; align-items: center; gap: 1.5rem;
  padding: .75rem 1.5rem; border-bottom: 1px solid var(--border);
  background: var(--surface);
}
header h1 { font-size: .95rem; color: var(--accent); letter-spacing: .05em; }
nav { display: flex; gap: .25rem; }
nav button {
  background: none; border: 1px solid transparent; color: var(--muted);
  padding: .3rem .8rem; border-radius: .375rem; cursor: pointer; font: inherit; font-size: .85rem;
}
nav button:hover { color: var(--text); }
nav button.active { color: var(--accent); border-color: var(--accent-dim); background: var(--accent-dim); }

main { padding: 1.5rem; max-width: 960px; }

section { display: none; }
section.visible { display: block; }

.toolbar {
  display: flex; gap: .5rem; align-items: center; margin-bottom: 1rem; flex-wrap: wrap;
}
input, select {
  background: var(--surface); border: 1px solid var(--border); color: var(--text);
  padding: .35rem .7rem; border-radius: .375rem; font: inherit; font-size: .85rem; outline: none;
}
input:focus, select:focus { border-color: var(--accent); }
input { min-width: 220px; }
button {
  background: var(--accent-dim); border: 1px solid var(--accent); color: var(--accent);
  padding: .35rem .9rem; border-radius: .375rem; cursor: pointer; font: inherit; font-size: .85rem;
}
button:hover { background: var(--accent); color: #fff; }
button.ghost { background: none; border-color: var(--border); color: var(--muted); }
button.ghost:hover { border-color: var(--text); color: var(--text); }
button.danger { border-color: var(--err); color: var(--err); background: none; }
button.danger:hover { background: var(--err); color: #fff; }

.agent-card {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: .5rem; margin-bottom: .75rem; overflow: hidden;
}
.agent-header {
  display: flex; align-items: center; gap: .75rem;
  padding: .6rem 1rem; border-bottom: 1px solid var(--border);
}
.agent-name { font-size: .9rem; flex: 1; }
.badge {
  font-size: .72rem; padding: .1rem .5rem; border-radius: 999px;
  border: 1px solid; color: var(--ok); border-color: var(--ok); background: rgba(34,197,94,.08);
}
.badge.inactive { color: var(--muted); border-color: var(--border); background: none; }
.agent-body { padding: .75rem 1rem; }
.token-row {
  display: flex; align-items: center; gap: .5rem;
  padding: .3rem 0; border-bottom: 1px solid var(--border); font-size: .8rem;
}
.token-row:last-child { border-bottom: none; }
.token-id { color: var(--muted); flex: 1; font-size: .75rem; }
.token-meta { color: var(--muted); font-size: .75rem; white-space: nowrap; }
.revoked { color: var(--err); }

.call-row {
  display: flex; align-items: flex-start; gap: .75rem;
  padding: .6rem 0; border-bottom: 1px solid var(--border); font-size: .82rem;
}
.call-row:last-child { border-bottom: none; }
.call-status { font-size: .7rem; padding: .1rem .4rem; border-radius: 999px; border: 1px solid; white-space: nowrap; }
.call-status.ok { color: var(--ok); border-color: var(--ok); }
.call-status.error { color: var(--err); border-color: var(--err); }
.call-body { flex: 1; min-width: 0; }
.call-meta { color: var(--muted); font-size: .75rem; margin-top: .2rem; }
.call-preview {
  color: var(--muted); font-size: .75rem; margin-top: .3rem;
  white-space: pre-wrap; word-break: break-all;
  max-height: 4rem; overflow: hidden;
}
.call-time { color: var(--muted); font-size: .75rem; white-space: nowrap; }
.call-ms { color: var(--muted); font-size: .72rem; }

#load-more { margin-top: 1rem; }
.empty { color: var(--muted); font-size: .85rem; padding: 1rem 0; }

.token-reveal {
  background: var(--surface); border: 1px solid var(--warn);
  border-radius: .375rem; padding: .75rem 1rem; margin: .5rem 0;
  font-size: .8rem;
}
.token-reveal code {
  display: block; word-break: break-all; color: var(--warn);
  margin: .4rem 0; font-size: .85rem;
}
</style>
</head>
<body>

<header>
  <h1>mcp-weather</h1>
  <nav>
    <button id="tab-actors" class="active">Agents</button>
    <button id="tab-audit">Audit</button>
  </nav>
</header>

<main>
  <section id="actors" class="visible">
    <div class="toolbar">
      <input id="new-name" placeholder="Agent name" />
      <button id="btn-create-actor">+ Create agent</button>
    </div>
    <div id="actors-list"></div>
  </section>

  <section id="audit">
    <div class="toolbar">
      <select id="f-actor"><option value="">All agents</option></select>
      <select id="f-tool"><option value="">All tools</option></select>
      <select id="f-status">
        <option value="">All statuses</option>
        <option value="ok">OK</option>
        <option value="error">Error</option>
      </select>
      <button id="btn-filter">Filter</button>
    </div>
    <div id="history-list"></div>
    <button id="load-more" class="ghost" style="display:none">Load more</button>
  </section>
</main>

<script>
const ADMIN_TOKEN = localStorage.getItem('admin_token') || '';

async function api(path, opts = {}) {
  const headers = { 'Content-Type': 'application/json', ...opts.headers };
  if (ADMIN_TOKEN) headers['Authorization'] = 'Bearer ' + ADMIN_TOKEN;
  const r = await fetch('/api' + path, { ...opts, headers });
  if (r.status === 401) {
    const token = prompt('Admin token required:');
    if (token) { localStorage.setItem('admin_token', token); location.reload(); }
    throw new Error('unauthorized');
  }
  if (!r.ok) {
    const body = await r.json().catch(() => ({}));
    throw new Error(body.error || r.statusText);
  }
  if (r.status === 204) return null;
  return r.json();
}

function showTab(name) {
  document.querySelectorAll('section').forEach(s => s.classList.remove('visible'));
  document.querySelectorAll('nav button').forEach(b => b.classList.remove('active'));
  document.getElementById(name).classList.add('visible');
  document.getElementById('tab-' + name).classList.add('active');
  if (name === 'audit') initAudit();
}

document.getElementById('tab-actors').addEventListener('click', () => showTab('actors'));
document.getElementById('tab-audit').addEventListener('click', () => showTab('audit'));
document.getElementById('btn-create-actor').addEventListener('click', createActor);
document.getElementById('btn-filter').addEventListener('click', resetHistory);
document.getElementById('load-more').addEventListener('click', loadHistory);

// ── Actors ────────────────────────────────────────────────────────────────────

async function loadActors() {
  const actors = await api('/actors');
  const el = document.getElementById('actors-list');
  if (!actors.length) { el.innerHTML = '<div class="empty">No agents yet.</div>'; return; }
  el.innerHTML = '';
  actors.forEach(a => {
    const card = document.createElement('div');
    card.className = 'agent-card';
    card.id = 'actor-' + a.id;

    const header = document.createElement('div');
    header.className = 'agent-header';

    const nameEl = document.createElement('span');
    nameEl.className = 'agent-name';
    nameEl.textContent = a.name;

    const badge = document.createElement('span');
    badge.className = 'badge' + (a.has_active_token ? '' : ' inactive');
    badge.textContent = a.has_active_token ? 'active' : 'no token';

    const issueBtn = document.createElement('button');
    issueBtn.className = 'ghost';
    issueBtn.style.fontSize = '.75rem';
    issueBtn.textContent = 'Issue token';
    issueBtn.addEventListener('click', () => issueToken(a.id, a.name));

    const revokeBtn = document.createElement('button');
    revokeBtn.className = 'danger';
    revokeBtn.style.fontSize = '.75rem';
    revokeBtn.textContent = 'Revoke all';
    revokeBtn.addEventListener('click', () => deleteActor(a.id, a.name));

    header.append(nameEl, badge, issueBtn, revokeBtn);

    const body = document.createElement('div');
    body.className = 'agent-body';
    body.id = 'tokens-' + a.id;
    body.innerHTML = '<div class="empty" style="font-size:.78rem">Loading tokens…</div>';

    card.append(header, body);
    el.appendChild(card);

    loadTokens(a.id);
  });
}

async function loadTokens(actorId) {
  const creds = await api('/actors/' + actorId + '/credentials');
  const el = document.getElementById('tokens-' + actorId);
  if (!creds.length) { el.innerHTML = '<div class="empty" style="font-size:.78rem">No tokens.</div>'; return; }
  el.innerHTML = '';
  creds.forEach(c => {
    const row = document.createElement('div');
    row.className = 'token-row';
    row.id = 'cred-' + c.id;

    const idEl = document.createElement('span');
    idEl.className = 'token-id';
    idEl.textContent = c.id.slice(0, 8) + '…';

    const issuedEl = document.createElement('span');
    issuedEl.className = 'token-meta';
    issuedEl.textContent = 'issued ' + reltime(c.created_at);

    row.append(idEl, issuedEl);

    if (c.revoked_at) {
      const revokedEl = document.createElement('span');
      revokedEl.className = 'revoked token-meta';
      revokedEl.textContent = 'revoked ' + reltime(c.revoked_at);
      row.appendChild(revokedEl);
    } else {
      const usedEl = document.createElement('span');
      usedEl.className = 'token-meta';
      usedEl.textContent = c.last_used_at ? 'last used ' + reltime(c.last_used_at) : 'never used';

      const revokeBtn = document.createElement('button');
      revokeBtn.className = 'danger';
      revokeBtn.style.cssText = 'font-size:.72rem;padding:.1rem .5rem';
      revokeBtn.textContent = 'Revoke';
      revokeBtn.addEventListener('click', () => revokeToken(actorId, c.id));

      row.append(usedEl, revokeBtn);
    }

    el.appendChild(row);
  });
}

async function createActor() {
  const name = document.getElementById('new-name').value.trim();
  if (!name) return;
  await api('/actors', { method: 'POST', body: JSON.stringify({ name }) });
  document.getElementById('new-name').value = '';
  loadActors();
}

async function issueToken(actorId, actorName) {
  const resp = await api('/actors/' + actorId + '/credentials', { method: 'POST' });
  // Show token once — it won't be retrievable again.
  const card = document.getElementById('actor-' + actorId);
  const existing = card.querySelector('.token-reveal');
  if (existing) existing.remove();

  const div = document.createElement('div');
  div.className = 'token-reveal';

  const msg = document.createElement('strong');
  msg.textContent = 'New token for ' + actorName + ' — copy it now, it won’t be shown again:';

  const code = document.createElement('code');
  code.textContent = resp.token;

  const copyBtn = document.createElement('button');
  copyBtn.className = 'ghost';
  copyBtn.style.fontSize = '.75rem';
  copyBtn.textContent = 'Copy';
  copyBtn.addEventListener('click', () => {
    navigator.clipboard.writeText(resp.token);
    copyBtn.textContent = 'Copied!';
  });

  div.append(msg, code, copyBtn);
  card.querySelector('.agent-header').after(div);
  loadActors();
}

async function revokeToken(actorId, credId) {
  await api('/credentials/' + credId, { method: 'DELETE' });
  loadActors();
}

async function deleteActor(actorId, name) {
  if (!confirm('Revoke all tokens for "' + name + '"? History is preserved.')) return;
  await api('/actors/' + actorId, { method: 'DELETE' });
  loadActors();
}

// ── Audit ─────────────────────────────────────────────────────────────────────

let historyCursor = '';

async function initAudit() {
  const [actors, tools] = await Promise.all([api('/actors'), api('/tool-calls/tools')]);
  const actorSel = document.getElementById('f-actor');
  actorSel.innerHTML = '<option value="">All agents</option>';
  actors.forEach(a => {
    const opt = document.createElement('option');
    opt.value = a.id;
    opt.textContent = a.name;
    actorSel.appendChild(opt);
  });
  const toolSel = document.getElementById('f-tool');
  toolSel.innerHTML = '<option value="">All tools</option>';
  tools.forEach(t => {
    const opt = document.createElement('option');
    opt.value = t;
    opt.textContent = t;
    toolSel.appendChild(opt);
  });
  resetHistory();
}

function resetHistory() {
  historyCursor = '';
  document.getElementById('history-list').innerHTML = '';
  loadHistory();
}

async function loadHistory() {
  const actor = document.getElementById('f-actor').value;
  const tool = document.getElementById('f-tool').value;
  const status = document.getElementById('f-status').value;
  const params = new URLSearchParams();
  if (actor) params.set('actor', actor);
  if (tool) params.set('tool', tool);
  if (status) params.set('status', status);
  if (historyCursor) params.set('cursor', historyCursor);

  const data = await api('/tool-calls?' + params);
  const el = document.getElementById('history-list');

  if (!data.calls.length && !historyCursor) {
    el.innerHTML = '<div class="empty">No tool calls recorded yet.</div>';
    document.getElementById('load-more').style.display = 'none';
    return;
  }

  data.calls.forEach(c => {
    const div = document.createElement('div');
    div.className = 'call-row';

    const statusLabel = c.is_error ? 'error' : 'ok';
    const statusEl = document.createElement('span');
    statusEl.className = 'call-status ' + statusLabel;
    statusEl.textContent = statusLabel;

    const body = document.createElement('div');
    body.className = 'call-body';

    const toolEl = document.createElement('strong');
    toolEl.style.fontSize = '.85rem';
    toolEl.textContent = c.tool;

    const actorEl = document.createElement('span');
    actorEl.className = 'call-meta';
    actorEl.textContent = data.actors[c.actor_id] || c.actor_id;

    const argsEl = document.createElement('div');
    argsEl.className = 'call-meta';
    argsEl.textContent = tryJSON(c.input_json);

    body.append(toolEl, actorEl, argsEl);

    const preview = c.is_error ? '' : tryJSON(c.output_json);
    if (preview) {
      const previewEl = document.createElement('div');
      previewEl.className = 'call-preview';
      previewEl.textContent = preview;
      body.appendChild(previewEl);
    }
    if (c.truncated) {
      const truncEl = document.createElement('span');
      truncEl.className = 'call-meta';
      truncEl.textContent = '(truncated)';
      body.appendChild(truncEl);
    }

    const meta = document.createElement('div');
    meta.style.textAlign = 'right';

    const timeEl = document.createElement('div');
    timeEl.className = 'call-time';
    timeEl.textContent = reltime(c.called_at);

    const msEl = document.createElement('div');
    msEl.className = 'call-ms';
    msEl.textContent = c.duration_ms + 'ms';

    meta.append(timeEl, msEl);
    div.append(statusEl, body, meta);
    el.appendChild(div);
  });

  historyCursor = data.next_cursor || '';
  document.getElementById('load-more').style.display = historyCursor ? '' : 'none';
}

// ── Helpers ───────────────────────────────────────────────────────────────────

function reltime(iso) {
  if (!iso) return '';
  const diff = (Date.now() - new Date(iso)) / 1000;
  if (diff < 60) return Math.round(diff) + 's ago';
  if (diff < 3600) return Math.round(diff / 60) + 'm ago';
  if (diff < 86400) return Math.round(diff / 3600) + 'h ago';
  return Math.round(diff / 86400) + 'd ago';
}

function tryJSON(s) {
  try { return JSON.stringify(JSON.parse(s), null, 1); } catch { return s || ''; }
}

// ── Init ──────────────────────────────────────────────────────────────────────
loadActors();
</script>
</body>
</html>
