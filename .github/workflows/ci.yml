name: CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install esbuild
        run: npm install --global esbuild@0.28.1

      - name: go vet
        run: go vet ./...

      - name: Test
        run: make test

      - name: Lint
        run: make lint

      - name: gosec
        run: make gosec

      - name: govulncheck
        run: make govulncheck

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          platforms: linux/amd64
          tags: weather:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: weather
          POSTGRES_PASSWORD: weather
          POSTGRES_DB: weather_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Test storage against Postgres
        env:
          TEST_POSTGRES_DSN: postgres://weather:weather@localhost:5432/weather_test
        run: go test ./internal/storage/... -v
